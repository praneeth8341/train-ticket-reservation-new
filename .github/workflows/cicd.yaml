
name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build WAR file
      - name: Build WAR File
        run: |
          mvn clean package -DskipTests

      # 4. SonarQube Scan
      - name: SonarQube Scan
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=train-ticket-reservation \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 5. Upload WAR to Nexus
      - name: Upload WAR to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          WAR_FILE=$(find target -name "*.war" | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi

          echo "WAR file found: $WAR_FILE"

          curl -v \
            -u "$NEXUS_USER:$NEXUS_PASS" \
            --upload-file "$WAR_FILE" \
            "$NEXUS_URL/repository/maven-releases/train-ticket-reservation.war"

      # 6. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_PORT: ${{ secrets.TOMCAT_PORT }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(find target -name "*.war" | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi

          echo "Deploying $WAR_FILE to Tomcat..."

          curl -v \
            -u "$TOMCAT_USER:$TOMCAT_PASS" \
            -T "$WAR_FILE" \
            "http://$TOMCAT_HOST:$TOMCAT_PORT/manager/text/deploy?path=/train-ticket-reservation&update=true"
```
